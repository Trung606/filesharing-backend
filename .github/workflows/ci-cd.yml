name: Backend CI/CD Pipeline

# Triggers the workflow on push or pull request events for the "main" branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Build the C# code and run your xUnit tests
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test --no-build --configuration Release --verbosity normal

  # JOB 2: If tests pass, build the Docker container and push to Docker Hub
  docker-push:
    needs: build-and-test # This ensures the push ONLY happens if tests succeed!
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./FileSharingAPI
        file: ./FileSharingAPI/Dockerfile
        push: true
        # This tags the image as 'yourusername/filesharing-api:latest'
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/filesharing-api:latest